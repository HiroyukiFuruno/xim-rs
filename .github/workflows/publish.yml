name: Publish zed-xim

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo.toml version to verify
        required: true
        type: string
        default: 0.5.0-zed
      publish:
        description: Publish after successful package verification (canonical owners only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-zed-xim
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify package identity and publication authority
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          package = tomllib.loads(Path("Cargo.toml").read_text())["package"]
          assert package["name"] == "zed-xim", package["name"]
          expected = os.environ["EXPECTED_VERSION"]
          if expected:
              assert package["version"] == expected, package["version"]
          else:
              assert os.environ["PUBLISH"] != "true"
          if os.environ["PUBLISH"] == "true":
              assert os.environ["GITHUB_REPOSITORY"] == "zed-industries/xim-rs"
              assert os.environ["GITHUB_REF"] == "refs/heads/main"
              assert os.environ["GITHUB_ACTOR"].casefold() in {"mikayla-maki", "mrsubidubi"}
          PYTHON
      - name: Resolve and verify the distributable package
        run: |
          cargo generate-lockfile
          cargo publish --locked --dry-run --all-features --package zed-xim
      - name: Publish verified source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --all-features --package zed-xim
      - name: Verify registry identity and checksum
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path
          version = os.environ["EXPECTED_VERSION"]
          request = urllib.request.Request(
              f"https://crates.io/api/v1/crates/zed-xim/{version}",
              headers={"User-Agent": "zed-xim-release-verification"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              published = json.load(response)["version"]
          artifact = Path(f"target/package/zed-xim-{version}.crate")
          checksum = hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert published["num"] == version, published
          assert published["checksum"] == checksum, published
          print(f"Verified zed-xim {version}: {checksum}")
          PYTHON
